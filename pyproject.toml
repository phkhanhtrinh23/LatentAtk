[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latentatk"
version = "0.1.0"
description = "Latent Agent Attacks on Recommender Systems: distilling a multi-role attacker into a single agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = [
    "torch>=2.4",
    "transformers>=5.14.0",
    "peft>=0.18",
    "accelerate>=1.2",
    "safetensors>=0.4",
]

[tool.setuptools.packages.find]
include = ["latentatk*"]
